<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lab Web - Nguyễn Thành Long</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .header { margin-bottom: 40px; }

        .header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            text-transform: uppercase; /* Tiêu đề viết hoa */
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            list-style: none;
        }

        .nav-item a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
            background: var(--card);
            text-decoration: none;
            color: var(--text-main);
            border-radius: 24px;
            font-weight: 800; /* Làm chữ đậm hơn cho ngầu */
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
            text-transform: uppercase; /* Ép toàn bộ link viết hoa */
        }

        .nav-item a i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .nav-item a:hover {
            transform: translateY(-12px);
            background: var(--primary);
            color: white;
            box-shadow: 0 25px 30px -10px rgba(79, 70, 229, 0.4);
        }

        .nav-item a:hover i { color: white; transform: scale(1.15); }

        footer { margin-top: 50px; color: var(--text-sub); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>MY LEARNING LABS</h1>
            <p>WEB DESIGN EXERCISE COLLECTION</p>
        </div>

        <ul class="nav-grid">
            <li class="nav-item">
                <a href="LAB1.html">
                    <i class="fas fa-flask"></i>
                    <span>LAB 01</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="LAB2.html">
                    <i class="fas fa-code"></i>
                    <span>LAB 02</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="LAB3.html">
                    <i class="fas fa-laptop-code"></i>
                    <span>LAB 03</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="LAB4.html">
                    <i class="fas fa-layer-group"></i>
                    <span>LAB 04</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="ONTAP.html">
                    <i class="fas fa-star"></i>
                    <span>REVIEW</span>
                </a>
            </li>
        </ul>

        <footer>
            <p>© 2026 - NGUYEN THANH LONG - LAB PORTFOLIO</p>
        </footer>
    </div>

</body>
</html>
